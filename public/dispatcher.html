<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wasili — Dispatcher</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<header class="app-header">
  <div class="brand">
    <div class="mark" id="markIcon"></div>
    <span class="brand-name">Wasili</span>
    <span class="brand-role">Dispatcher</span>
  </div>
  <div class="header-actions">
    <span class="header-user" id="userLabel"></span>
    <button class="icon-btn" id="logoutBtn"></button>
  </div>
</header>

<main class="shell">
  <h1 class="page-title">Dispatch board</h1>
  <p class="page-sub">Assign open requests to a rider who's operational, under capacity, and has the right vehicle.</p>

  <div class="section-label" id="ridersLabel"></div>
  <div id="riders" class="stack" style="margin-bottom: 10px;"></div>

  <div class="section-label" id="openLabel"></div>
  <div class="sync-note"><span class="sync-dot"></span> Live — new requests appear automatically</div>
  <div id="open"></div>

  <div class="section-label" id="activeLabel"></div>
  <div id="active"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/appwrite@26.2.0"></script>
<script src="/js/wasili-client.js"></script>
<script src="/js/icons.js"></script>
<script>
  const session = Wasili.requireRole("dispatcher");

  document.getElementById("markIcon").innerHTML = icon("truck", { size: 16 });
  document.getElementById("logoutBtn").innerHTML = icon("logOut", { size: 15 }) + " Sign out";
  document.getElementById("logoutBtn").addEventListener("click", () => Wasili.logout());
  document.getElementById("userLabel").textContent = session.name;
  document.getElementById("ridersLabel").innerHTML = icon("user", { size: 15 }) + " Riders";
  document.getElementById("openLabel").innerHTML = icon("alertCircle", { size: 15 }) + " Open requests";
  document.getElementById("activeLabel").innerHTML = icon("package", { size: 15 }) + " In progress";

  const VEHICLE_TIER = ["BICYCLE", "MOTORCYCLE", "CAR", "VAN", "TRUCK"];
  function vehicleCompatible(riderVehicle, requiredVehicle) {
    return VEHICLE_TIER.indexOf(riderVehicle) >= VEHICLE_TIER.indexOf(requiredVehicle);
  }

  let deliveries = [];
  let riders = [];

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function riderOptionsFor(requiredVehicleType, excludeRiderId) {
    return riders
      .filter((r) => r.$id !== excludeRiderId)
      .filter((r) => r.riderStatus !== "OFFLINE" && r.riderStatus !== "UNAVAILABLE")
      .filter((r) => r.activeDeliveries < r.capacity)
      .filter((r) => vehicleCompatible(r.vehicleType, requiredVehicleType))
      .map((r) => `<option value="${r.$id}">${escapeHtml(r.name)} — ${r.vehicleType} (${r.activeDeliveries}/${r.capacity})</option>`)
      .join("");
  }

  async function assign(deliveryId, riderId, selectEl) {
    if (!riderId) return;
    selectEl.disabled = true;
    try {
      const updated = await Wasili.assignDelivery(deliveryId, riderId);
      applyDeliveryUpdate(updated);
      await refreshRiders();
    } catch (err) {
      alert(err.message);
      selectEl.disabled = false;
    }
  }
  window.assign = assign;

  async function cancel(deliveryId, btn) {
    if (!confirm("Cancel this delivery?")) return;
    btn.disabled = true;
    try {
      const updated = await Wasili.cancelDelivery(deliveryId);
      applyDeliveryUpdate(updated);
      await refreshRiders();
    } catch (err) {
      alert(err.message);
      btn.disabled = false;
    }
  }
  window.cancel = cancel;

  function applyDeliveryUpdate(updated) {
    const idx = deliveries.findIndex((d) => d.$id === updated.$id);
    if (idx !== -1) deliveries[idx] = updated;
    else deliveries.unshift(updated);
    render();
  }

  async function refreshRiders() {
    riders = await Wasili.listRiders();
    render();
  }

  function renderRiders() {
    const el = document.getElementById("riders");
    el.innerHTML = riders
      .map(
        (r) => `
      <div class="card delivery-row">
        <div class="delivery-icon">${icon("truck", { size: 19 })}</div>
        <div class="delivery-main">
          <div class="delivery-item">${escapeHtml(r.name)}</div>
          <div class="delivery-meta">
            <span>${r.vehicleType}</span>
            <span class="sep">&middot;</span>
            <span>${r.activeDeliveries}/${r.capacity} active</span>
          </div>
        </div>
        <span class="rider-status-pill rider-status-${r.riderStatus}">${r.riderStatus.replace(/_/g, " ")}</span>
      </div>`
      )
      .join("");
  }

  function render() {
    renderRiders();

    const open = deliveries.filter((d) => d.deliveryStatus === "OPEN");
    const active = deliveries.filter((d) => !["OPEN", "DELIVERED", "CANCELLED"].includes(d.deliveryStatus));

    const openEl = document.getElementById("open");
    openEl.innerHTML = open.length
      ? open
          .map((d) => {
            const options = riderOptionsFor(d.requiredVehicleType, null);
            return `
      <div class="card delivery-row">
        <div class="delivery-icon">${icon("package", { size: 19 })}</div>
        <div class="delivery-main">
          <div class="delivery-item">${escapeHtml(d.itemDescription)} <span class="muted" style="font-weight:400; font-size:12px;">(${d.requiredVehicleType})</span></div>
          <div class="delivery-meta"><span>${escapeHtml(d.customerName)}</span><span class="sep">&middot;</span><span>${escapeHtml(d.address)}</span></div>
        </div>
        <select class="field" style="width:auto; min-width:190px;" onchange="assign('${d.$id}', this.value, this)" ${options ? "" : "disabled"}>
          <option value="">${options ? "Assign rider…" : "No eligible rider"}</option>
          ${options}
        </select>
      </div>`;
          })
          .join("")
      : `<div class="card empty-state"><div class="icon">${icon("checkCircle", { size: 30 })}</div><div class="title">All caught up</div><div class="hint">No open requests waiting on a rider.</div></div>`;

    const activeEl = document.getElementById("active");
    activeEl.innerHTML = active.length
      ? active
          .map((d) => {
            const rider = riders.find((r) => r.$id === d.riderId);
            const canReassign = d.deliveryStatus === "ASSIGNED" || d.deliveryStatus === "ACCEPTED";
            const reassignOptions = canReassign ? riderOptionsFor(d.requiredVehicleType, d.riderId) : "";
            return `
      <div class="card delivery-row">
        <div class="delivery-icon">${icon("package", { size: 19 })}</div>
        <div class="delivery-main">
          <div class="delivery-item">${escapeHtml(d.itemDescription)}</div>
          <div class="delivery-meta">
            <span>${escapeHtml(d.customerName)}</span>
            ${rider ? `<span class="sep">&middot;</span><span>${icon("user", { size: 12 })} ${escapeHtml(rider.name)}</span>` : ""}
          </div>
        </div>
        ${canReassign ? `<select class="field" style="width:auto; min-width:170px;" onchange="assign('${d.$id}', this.value, this)"><option value="">Reassign…</option>${reassignOptions}</select>` : ""}
        <button class="btn-secondary" onclick="cancel('${d.$id}', this)">Cancel</button>
        <span class="badge badge-${d.deliveryStatus}">${d.deliveryStatus.replace(/_/g, " ")}</span>
      </div>`;
          })
          .join("")
      : `<div class="card empty-state"><div class="hint">Nothing in progress right now.</div></div>`;
  }

  async function loadAll() {
    [deliveries, riders] = await Promise.all([Wasili.listDeliveries(), Wasili.listRiders()]);
    render();
  }

  loadAll();

  Wasili.onDeliveryChange((updated) => applyDeliveryUpdate(updated));
  Wasili.onRiderChange((updated) => {
    const idx = riders.findIndex((r) => r.$id === updated.$id);
    if (idx !== -1) riders[idx] = updated;
    render();
  });
</script>
</body>
</html>
