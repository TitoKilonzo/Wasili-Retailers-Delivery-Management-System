<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wasili — RetailerStaff</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<header class="app-header">
  <div class="brand">
    <div class="mark" id="markIcon"></div>
    <span class="brand-name">Wasili</span>
    <span class="brand-role">RetailerStaff</span>
  </div>
  <div class="header-actions">
    <span class="header-user" id="userLabel"></span>
    <button class="icon-btn" id="logoutBtn"></button>
  </div>
</header>

<main class="shell">
  <h1 class="page-title">New delivery request</h1>
  <p class="page-sub">Log what's going out, to whom, and what it needs to get there.</p>

  <div class="card">
    <form id="form" class="form-grid">
      <div class="field"><label for="customerName">Customer name</label><input id="customerName" required /></div>
      <div class="field"><label for="customerPhone">Customer phone</label><input id="customerPhone" placeholder="0712345678" required /></div>
      <div class="field"><label for="address">Delivery address</label><input id="address" required /></div>
      <div class="field"><label for="itemDescription">Item description</label><input id="itemDescription" required /></div>
      <div class="field">
        <label for="requiredVehicleType">Required vehicle</label>
        <select id="requiredVehicleType" required>
          <option value="BICYCLE">Bicycle — small, nearby</option>
          <option value="MOTORCYCLE" selected>Motorcycle — standard package</option>
          <option value="CAR">Car — multiple items</option>
          <option value="VAN">Van — bulky load</option>
          <option value="TRUCK">Truck — large/heavy load</option>
        </select>
      </div>
      <div id="formError" class="form-error"></div>
      <button class="btn-primary" type="submit" id="submitBtn"></button>
    </form>
  </div>

  <div class="section-label" id="requestsLabel"></div>
  <div class="sync-note"><span class="sync-dot"></span> Live — updates as riders confirm delivery</div>
  <div id="list"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/appwrite@26.2.0"></script>
<script src="/js/wasili-client.js"></script>
<script src="/js/icons.js"></script>
<script>
  const session = Wasili.requireRole("retailerstaff");

  document.getElementById("markIcon").innerHTML = icon("package", { size: 16 });
  document.getElementById("logoutBtn").innerHTML = icon("logOut", { size: 15 }) + " Sign out";
  document.getElementById("logoutBtn").addEventListener("click", () => Wasili.logout());
  document.getElementById("userLabel").textContent = session.name;
  document.getElementById("submitBtn").innerHTML = icon("plus", { size: 16 }) + " Log request";
  document.getElementById("requestsLabel").innerHTML = icon("inbox", { size: 15 }) + " Your requests";

  const form = document.getElementById("form");
  const errorEl = document.getElementById("formError");
  const submitBtn = document.getElementById("submitBtn");
  const list = document.getElementById("list");

  let deliveries = [];

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function canCancel(d) {
    return d.deliveryStatus === "OPEN";
  }

  async function cancel(deliveryId, btn) {
    if (!confirm("Cancel this delivery request?")) return;
    btn.disabled = true;
    try {
      const updated = await Wasili.cancelDelivery(deliveryId);
      applyUpdate(updated);
    } catch (err) {
      alert(err.message);
      btn.disabled = false;
    }
  }
  window.cancel = cancel;

  function applyUpdate(updated) {
    const idx = deliveries.findIndex((d) => d.$id === updated.$id);
    if (idx !== -1) deliveries[idx] = { ...updated, confirmationCode: deliveries[idx].confirmationCode };
    render();
  }

  function render() {
    if (!deliveries.length) {
      list.innerHTML = `<div class="card empty-state">
        <div class="icon">${icon("inbox", { size: 30 })}</div>
        <div class="title">No requests yet</div>
        <div class="hint">Log your first delivery above and it'll show up here.</div>
      </div>`;
      return;
    }
    list.innerHTML = deliveries
      .map(
        (d) => `
      <div class="card delivery-row">
        <div class="delivery-icon">${icon("package", { size: 19 })}</div>
        <div class="delivery-main">
          <div class="delivery-item">${escapeHtml(d.itemDescription)} <span class="muted" style="font-weight:400; font-size:12px;">(${d.requiredVehicleType})</span></div>
          <div class="delivery-meta">
            <span>${escapeHtml(d.customerName)}</span>
            <span class="sep">&middot;</span>
            <span>${escapeHtml(d.address)}</span>
            ${d.confirmationCode ? `<span class="sep">&middot;</span><span class="confirm-code">code ${d.confirmationCode}</span>` : ""}
          </div>
        </div>
        ${canCancel(d) ? `<button class="btn-secondary" onclick="cancel('${d.$id}', this)">Cancel</button>` : ""}
        <span class="badge badge-${d.deliveryStatus}">${d.deliveryStatus.replace(/_/g, " ")}</span>
      </div>`
      )
      .join("");
  }

  async function loadDeliveries() {
    deliveries = await Wasili.listDeliveries([Wasili.Query.equal("retailerStaffId", [session.id])]);
    render();
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorEl.classList.remove("visible");
    submitBtn.disabled = true;

    try {
      const body = {
        customerName: document.getElementById("customerName").value.trim(),
        customerPhone: document.getElementById("customerPhone").value.trim(),
        address: document.getElementById("address").value.trim(),
        itemDescription: document.getElementById("itemDescription").value.trim(),
        requiredVehicleType: document.getElementById("requiredVehicleType").value,
      };
      const created = await Wasili.createDelivery(body);
      deliveries.unshift(created);
      render();
      form.reset();
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.classList.add("visible");
    } finally {
      submitBtn.disabled = false;
    }
  });

  loadDeliveries();

  Wasili.onDeliveryChange((updated) => {
    if (updated.retailerStaffId === session.id) applyUpdate(updated);
  });
</script>
</body>
</html>
