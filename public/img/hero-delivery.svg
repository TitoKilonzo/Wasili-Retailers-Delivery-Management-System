<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" fill="none">
  <!-- Background concentric arcs, echoes the brand's circular motif -->
  <circle cx="430" cy="130" r="230" fill="#1F4A3E"/>
  <circle cx="430" cy="130" r="160" fill="#245646"/>
  <circle cx="430" cy="130" r="95" fill="#2A614F"/>

  <!-- Route: dashed path from shop to customer pin -->
  <path d="M90 420 C 180 460, 230 340, 320 360 S 430 300, 470 220"
        stroke="#C97B3E" stroke-width="3" stroke-dasharray="2 14" stroke-linecap="round"/>

  <!-- Shop marker -->
  <g transform="translate(60,380)">
    <rect x="0" y="18" width="60" height="46" rx="4" fill="#F6F4EE"/>
    <path d="M-4 18 L30 -6 L64 18 Z" fill="#F6F4EE"/>
    <rect x="24" y="38" width="14" height="26" fill="#1F5F4F"/>
    <rect x="6" y="26" width="12" height="12" rx="1.5" fill="#E7CBA7"/>
    <rect x="42" y="26" width="12" height="12" rx="1.5" fill="#E7CBA7"/>
  </g>

  <!-- Rider on route, mid-journey -->
  <g transform="translate(300,330)">
    <circle cx="0" cy="30" r="16" fill="none" stroke="#F6F4EE" stroke-width="3"/>
    <circle cx="52" cy="30" r="16" fill="none" stroke="#F6F4EE" stroke-width="3"/>
    <path d="M0 30 L20 30 L34 6 L46 6" stroke="#F6F4EE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M20 30 L34 30 L52 30" stroke="#F6F4EE" stroke-width="3" stroke-linecap="round" fill="none"/>
    <rect x="26" y="-10" width="16" height="16" rx="3" fill="#C97B3E"/>
    <circle cx="34" cy="-24" r="7" fill="#F6F4EE"/>
  </g>

  <!-- Destination pin -->
  <g transform="translate(455,150)">
    <path d="M0 0C-16 0 -28 12 -28 28c0 22 28 46 28 46s28-24 28-46C28 12 16 0 0 0Z" fill="#F6F4EE"/>
    <circle cx="0" cy="27" r="10" fill="#1F5F4F"/>
  </g>

  <!-- Status chips, echo the app's own status badges -->
  <g transform="translate(120,120)">
    <rect width="150" height="34" rx="17" fill="#F6F4EE" opacity="0.95"/>
    <circle cx="20" cy="17" r="6" fill="#C97B3E"/>
    <text x="36" y="22" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#1A1F1C">Assigned</text>
  </g>
  <g transform="translate(70,220)">
    <rect width="168" height="34" rx="17" fill="#F6F4EE" opacity="0.95"/>
    <circle cx="20" cy="17" r="6" fill="#1F5F4F"/>
    <text x="36" y="22" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#1A1F1C">Picked Up</text>
  </g>
</svg>
